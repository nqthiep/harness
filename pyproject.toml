[project]
name = "harness"
version = "0.1.0.dev0"
description = "Build AI agents that are cheap to run, hard to misuse, and easy to start with."
requires-python = ">=3.11"
dependencies = ["anthropic", "typing-extensions", "jsonschema"]

[project.scripts]
# Every no-key message in this library says "Run: harness setup". Without this entry
# there was no `harness` command at all to run (ADR-086).
harness = "harness.cli:main"

[project.optional-dependencies]
# 36 transitive packages against NFR-05's budget of three, measured — which is why it is
# an extra and not a dependency (ADR-032).  `import harness` must never import LangChain.
# `langgraph-checkpoint-sqlite` is `Agent(durable=True)`'s default checkpoint store
# (agent.py::_build_checkpointer) — +3 measured (itself, `aiosqlite`, `sqlite-vec`;
# `langgraph`/`langchain-core` were already satisfied), not a separate extra: durable=True
# IS the graph backend, just without the vocabulary reaching the caller.
graph = ["langgraph>=1.0", "langchain-core>=1.0", "langgraph-checkpoint-sqlite>=2.0"]
# The CLIENT only.  The `openviking` server package resolves to 185 transitive packages
# — a web crawler and two other LLM SDKs among them — because it is a database server,
# and you run it as a process rather than vendoring it into a library (ADR-035).
viking = ["openviking-sdk>=0.1.9"]
otel = ["opentelemetry-api", "opentelemetry-sdk"]
# MCP CLIENT only — a harness embeds MCP servers as tools, it does not host one. T-9.1,
# docs/17-research-alignment.md M9.
mcp  = ["mcp>=1.9"]
# ASGI Service API (POST /v1/runs, SSE events, approvals, cancel) — T-9.2. `starlette`
# only; an operator brings their own ASGI server (uvicorn, hypercorn, ...) to actually
# serve `create_app()`'s app, so that is not a dependency of this extra.
server = ["starlette>=1.0"]
dev  = ["pytest", "mypy", "ruff", "hypothesis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.ruff]
line-length = 95
src = ["src"]

[tool.ruff.lint]
# F  — the ones that find real defects: dead imports, redefinitions, unused locals.
# E4/E9 — import and syntax errors.
# E7 minus E701/E702: this package deliberately writes one-line accessors
#   (`def spent(self) -> Money: return self._spent`) and paired statements
#   (`self.a, self.b = a, b`).  That is a house style applied consistently, and
#   rewriting ~60 working lines to satisfy a default would be churn with risk and no
#   reader benefit — KISS, and HARNESS.md §III's "not over-engineer" cuts both ways.
select = ["F", "E4", "E7", "E9", "W"]
ignore = ["E701", "E702", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E401"]        # grouped imports in test scaffolding are readable

[tool.mypy]
python_version = "3.11"
files = ["src/harness", "examples"]
# `examples/` is CO-ANALYSED with core, not checked as a separate unit. That is the
# stronger configuration: cross-module calls get their real types instead of `Any`, which
# is what surfaced the last 10 findings (ADR-087) after the separate-unit run was already
# clean. Pointing the checker at these files is also what caught two core annotation
# defects — `Profile.name` declared settable, so no frozen profile satisfied the
# Protocol, and `Agent.safety` annotated `str` while `__init__` takes a `Literal`
# (ADR-082).
# Measured before keeping it (ADR-105): turning this OFF produces 18 errors, of which 16
# are import noise — `mediapipe`, `openviking_sdk`, `langchain_anthropic`, `readability`,
# the flat `examples/` modules that are on `sys.path` rather than importable as a package,
# and `jsonschema`, which is installed but ships no `py.typed`. ZERO of the 16 is a type
# error in this repository's own code, so a global flip buys noise and costs a stub
# dependency (`types-jsonschema`). It stays — but NOT for `anthropic`; see below.
ignore_missing_imports = true
# Not `strict`.  Round 39 took mypy from 112 errors to a documented remainder, and the
# value was never the count: it was that **a user running mypy on `agent.name` was told
# the attribute does not exist**, and that `Money`, `Usage`, `Result` and every other
# value type accepted any arguments at all.  Both are fixed.  Turning on `strict` next
# would buy annotations on internals nobody calls — HARNESS.md §III, not over-engineer.
disable_error_code = [
    # `__hash__ = None` is IDL-32: equal-by-value secrets that hash by name violate
    # Python's hash invariant.  mypy reads it as assigning None over a method.
    "assignment",
]

# The one place `ignore_missing_imports` was actively harmful, and how it hid for a whole
# round: `anthropic` is a DECLARED RUNTIME DEPENDENCY that ships `py.typed`, and the mypy
# on `PATH` is a uv tool venv that does not have it installed. The global setting turned
# the entire SDK into `Any`, `models/anthropic.py` — the only file that touches it — type
# checked against nothing, and `test_mypy_is_clean` reported success over an erased
# surface while `python -m mypy` found 13 real errors in that file (ADR-105).
#
# Declared dependencies are exactly the imports that must NOT be ignorable: a missing one
# is a broken environment, not an untyped third party. `jsonschema` cannot join this list
# without `types-jsonschema` (installed, but no `py.typed`), and `typing-extensions` is
# vendored into mypy itself, so `anthropic` is the whole of it today.
[[tool.mypy.overrides]]
module = ["anthropic.*"]
ignore_missing_imports = false
