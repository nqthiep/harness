[project]
name = "harness"
version = "0.1.0.dev0"
description = "Build AI agents that are cheap to run, hard to misuse, and easy to start with."
requires-python = ">=3.11"
dependencies = ["anthropic", "typing-extensions", "jsonschema"]

[project.optional-dependencies]
# 36 transitive packages against NFR-05's budget of three, measured — which is why it is
# an extra and not a dependency (ADR-032).  `import harness` must never import LangChain.
graph = ["langgraph>=1.0", "langchain-core>=1.0"]
otel = ["opentelemetry-api", "opentelemetry-sdk"]
dev  = ["pytest", "mypy", "ruff", "hypothesis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]
